plugins {
    id 'java'
    id "io.freefair.lombok" version "9.7.0"
    id 'io.qameta.allure' version '4.3.0'
}

group = 'com.herokuapp.restful_booker'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

def allureVersion = "2.25.0"

allure {
    report {
        version.set(allureVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

dependencies {
    testImplementation(
            'org.junit.jupiter:junit-jupiter:6.1.3',
            'io.rest-assured:rest-assured:6.0.1',
            'io.rest-assured:json-schema-validator:6.0.1',
            "io.qameta.allure:allure-rest-assured:$allureVersion"
    )
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperties(System.getProperties())
}